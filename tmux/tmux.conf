# bruh
unbind-key -a
unbind C-b
set -g prefix `
bind ` send-prefix
set -g repeat-time 500  # increase "prefix-free" window
set -g history-limit 200000

# restore some defaults
bind-key : command-prompt

# mouse
bind m set mouse\; display-message "Mouse #{?mouse,on,off}"

# Options
set -g mouse off
set -g renumber-windows on  # keep numbering sequential
set -g escape-time 0

# color support
set -g default-terminal "${TERM}"
set -sg terminal-overrides ",*:RGB"  # true color support

# Theme: status
set -g status on
set -g status-interval 3

set -g status-style bg=default,fg=default
set -g status-left ""
set -g status-right "#[fg=default,bold]#S #[fg=default]%Y-%m-%d %H:%M"

# Theme: status (windows)
set -g window-status-format " #W "
set -g window-status-current-format " -#W- "

set -g window-status-current-style "fg=magenta,nobold"
set -g window-status-current-style "#{?window_zoomed_flag,fg=yellow,fg=magenta,nobold}"

# Theme: borders
set -g pane-border-lines single
set -g pane-border-style fg=default,bright
set -g pane-active-border-style fg=magenta,bright

# Keybindings: split
bind-key -T prefix \( split-window -h -c "#{pane_current_path}"
bind-key -T prefix \) split-window -v -c "#{pane_current_path}"
bind-key -T prefix W kill-pane

set -g pane-border-format " #{pane_index} "
set -g pane-border-status top

# Keybindings: windows
bind-key -T prefix T new-window -c "#{pane_current_path}"
bind -r S-Right next-window
bind -r S-Left previous-window

# Session:
bind-key -T prefix s choose-session
bind-key -T prefix S command-prompt -p "New session name:" "new-session -s '%%'"

# keybind:
bind d display-panes
bind q detach-client
bind-key -T prefix Q confirm-before -p "Kill session #S? (y/n)" kill-session

# misc
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Reloaded tmux.conf ok"

# defaults
bind-key -r      Up select-pane -U
bind-key -r    Down select-pane -D
bind-key -r    Left select-pane -L
bind-key -r   Right select-pane -R

# Pane resize (hold to repeat)
bind-key -T prefix -r C-Up    resize-pane -U 1
bind-key -T prefix -r C-Down  resize-pane -D 1
bind-key -T prefix -r C-Left  resize-pane -L 1
bind-key -T prefix -r C-Right resize-pane -R 1