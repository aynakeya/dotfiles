format = """\\[$username [@](bold) $hostname\\]:\
$directory\
$fill\
$git_branch\
\n\
$python$time\
$character"""

add_newline = false


[username]
style_user = "bold fg:213"
show_always = true
format = '[$user]($style)'

[python]
format = "[(\\($virtualenv\\))]($style)"
style = "bold white"
pyenv_version_name = false
python_binary = "python"

[hostname]
style = "bold fg:213"
ssh_only = false
format = '[$hostname]($style)'

[fill]
symbol = ' '

[git_branch]
format = "\\([$branch]($style)\\)"
style = "bold fg:214"   # 自己改颜色，比如橙色

[directory]
style = "bold fg:74"
truncate_to_repo = false
truncation_length = 0

[time]
disabled = false
format = "[$time]($style)"
time_format = "%H:%M:%S"
style = "bold"

[character]
format = ' $symbol '
success_symbol = "\\$"
error_symbol = "\\$"
vicmd_symbol = "\\$"